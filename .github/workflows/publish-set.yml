name: Publish-set invariant

# Why this exists: on 2026-08-31 the 0.4.2 release was half-published — two of
# the twelve workspace crates reached crates.io, ten stayed at 0.4.1, and README
# already told users to depend on 0.4.2. Nothing noticed for a day. This job
# compares the crates.io index with the workspace and fails when the set drifts
# (bead bd-jeof.2). It also proves the 0.4.2 fix from the registry side: no
# published crate may enable asupersync's `test-internals` feature in a normal
# dependency (bead bd-jeof.3, the "downstream constitution").
#
# Runs daily, on demand, and after the release workflow publishes.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  index-vs-workspace:
    name: crates.io index matches the workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Compare published versions and normal-dependency features
        shell: bash
        run: |
          set -euo pipefail
          ua="sqlmodel_rust-publish-set-check (github actions)"
          ws=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="sqlmodel") | .version')
          crates=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.publish == null) | .name' | sort)
          echo "workspace version: $ws"
          printf '%-26s %-10s %-10s %s\n' crate published workspace asupersync-features
          fail=0; versions=""
          for c in $crates; do
            json=$(curl -sf -A "$ua" "https://crates.io/api/v1/crates/$c" || echo '{}')
            pub=$(echo "$json" | jq -r '.crate.max_version // "unpublished"')
            feats="-"
            if [ "$pub" != "unpublished" ]; then
              feats=$(curl -sf -A "$ua" "https://crates.io/api/v1/crates/$c/$pub/dependencies" \
                | jq -c '[.dependencies[] | select(.crate_id=="asupersync" and .kind=="normal") | .features] | flatten' || echo '[]')
              if echo "$feats" | grep -q 'test-internals'; then
                echo "::error::$c $pub enables asupersync test-internals in a normal dependency"; fail=1
              fi
            fi
            printf '%-26s %-10s %-10s %s\n' "$c" "$pub" "$ws" "$feats"
            versions="$versions $pub"
            sleep 1  # crates.io asks for at most one request per second
          done
          distinct=$(echo $versions | tr ' ' '\n' | sort -u | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "::error::published versions diverge across the crate set ($(echo $versions | tr ' ' '\n' | sort -u | tr '\n' ' ')) — the lockstep release is incomplete"; fail=1
          fi
          published=$(echo $versions | tr ' ' '\n' | sort -u | head -n1)
          if [ "$distinct" -eq 1 ] && [ "$published" != "$ws" ]; then
            echo "::warning::workspace is at $ws but the index is at $published — either an unreleased bump (fine while unreleased) or a forgotten publish"
          fi
          exit $fail

  downstream-constitution:
    name: downstream consumer dependency constitution
    needs: index-vs-workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Verify downstream dependency constitution from registry
        shell: bash
        run: |
          set -euo pipefail
          ws=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="sqlmodel") | .version')
          echo "Testing downstream dependency constitution for version $ws"

          tmp_dir=$(mktemp -d)
          cd "$tmp_dir"
          cargo new --bin consumer
          cd consumer

          # Dynamically derive all publishable crates from workspace metadata
          crates=$(cargo metadata --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --format-version 1 --no-deps | jq -r '.packages[] | select(.publish == null) | .name')

          cat <<EOF > Cargo.toml
          [package]
          name = "consumer"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          EOF

          for c in $crates; do
            if [ "$c" = "sqlmodel-console" ]; then
              echo "$c = { version = \"$ws\", features = [\"rich\"] }" >> Cargo.toml
            else
              echo "$c = \"$ws\"" >> Cargo.toml
            fi
          done

          echo "Generated consumer Cargo.toml:"
          cat Cargo.toml

          cargo generate-lockfile

          # 1. Assert visibility proc-macro is NOT pulled in by normal dependencies
          echo "Checking for visibility proc-macro..."
          vis=$(cargo tree -e normal -i visibility || true)
          if [ -n "$vis" ]; then
            echo "::error::visibility macro present in consumer normal dependencies:"
            echo "$vis"
            exit 1
          fi

          # 2. Assert exactly one version of asupersync resolves
          echo "Checking for single asupersync version..."
          asupersync_count=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="asupersync") | .version' | sort -u | wc -l)
          if [ "$asupersync_count" -ne 1 ]; then
            echo "::error::expected exactly 1 asupersync version in dependency graph, found $asupersync_count"
            cargo tree -i asupersync
            exit 1
          fi

          # 3. Assert tokio is absent from normal dependencies
          echo "Checking for forbidden tokio crate..."
          tokio_tree=$(cargo tree -e normal -i tokio || true)
          if [ -n "$tokio_tree" ]; then
            echo "::error::forbidden crate tokio detected in consumer normal dependencies:"
            echo "$tokio_tree"
            exit 1
          fi

          # Test 2: default-features = false with sqlmodel/console
          cat <<EOF > Cargo.toml
          [package]
          name = "consumer"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          sqlmodel = { version = "$ws", default-features = false, features = ["console"] }
          EOF

          cargo generate-lockfile

          vis2=$(cargo tree -e normal -i visibility || true)
          if [ -n "$vis2" ]; then
            echo "::error::visibility macro present with default-features = false:"
            echo "$vis2"
            exit 1
          fi

          tokio_tree2=$(cargo tree -e normal -i tokio || true)
          if [ -n "$tokio_tree2" ]; then
            echo "::error::forbidden crate tokio detected with default-features = false:"
            echo "$tokio_tree2"
            exit 1
          fi

          echo "Downstream dependency constitution verified successfully."

