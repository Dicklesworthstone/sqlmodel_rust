name: Bench trend report

# Monthly full-suite benchmark run (bd-4ttf.4): every bench, including the
# I/O-bound ones that the CI regression guard deliberately skips, with the
# raw criterion output uploaded as an artifact for trend spotting. The guard
# thresholds in crates/sqlmodel-e2e/benches/thresholds.toml are NOT applied
# here - this is recording, not gating.

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of every month, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-bench-report:
    name: Full bench suite report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Run the full bench suite
        run: cargo bench -p sqlmodel-e2e -- --noplot

      - name: Upload criterion reports
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report-${{ github.run_id }}
          path: target/criterion
          retention-days: 30
          if-no-files-found: warn
