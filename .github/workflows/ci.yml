name: CI

# Action pinning policy: Major version tags with automated weekly Dependabot updates
# (.github/dependabot.yml). Floating on major tags receives security and bugfix minor
# and patch updates automatically, while major version transitions are reviewed
# in grouped pull requests. GitHub Actions currency is reviewed on every dependency refresh.
#
# Toolchain note: rust-toolchain.toml pins nightly-2026-08-25 and rustup honors
# it in every job below; the dtolnay action is used only to add components and
# targets. All dependencies resolve from crates.io (no local clones since 0.4.0)
# and libsqlite3-sys is built with the bundled amalgamation, so no job installs
# SQLite or clones sibling repositories.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  pool-checkout:
    name: Pool checkout deadlines and cancellation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-Z threads=1"
    steps:
      - uses: actions/checkout@v7

      - name: Install the repository-pinned toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: pool-checkout

      - name: Check pool formatting
        run: cargo fmt -p sqlmodel-pool -- --check

      - name: Run pool regressions with the locked dependency graph
        run: cargo test --locked -p sqlmodel-pool --all-targets --config 'profile.dev.package."*".opt-level=0'

      - name: Check pool lints
        run: cargo clippy --locked -p sqlmodel-pool --all-targets --config 'profile.dev.package."*".opt-level=0' -- -D warnings

  postgres-runtime-handoff:
    name: PostgreSQL runtime handoff (${{ matrix.graph }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        graph: [previous-registry, published-unfixed, staged-fixed]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sqlmodel
          POSTGRES_PASSWORD: sqlmodel
          POSTGRES_DB: sqlmodel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqlmodel -d sqlmodel_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SQLMODEL_TEST_POSTGRES_URL: postgres://sqlmodel:sqlmodel@127.0.0.1:5432/sqlmodel_test
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: ${{ runner.temp }}/runtime-handoff-target
      RUSTFLAGS: "-Z threads=1"
    steps:
      - uses: actions/checkout@v7

      - name: Install the repository-pinned toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: runtime-handoff-${{ matrix.graph }}

      - name: Check the standalone witness formatting
        run: rustfmt --edition 2024 --check crates/sqlmodel-e2e/runtime-handoff/main.rs

      - name: Qualify the staged fixed runtime with production features
        if: matrix.graph == 'staged-fixed'
        run: |
          # Stage only the runtime requirement in a copied source snapshot.
          # The all-driver workspace still awaits a compatible FrankenSQLite
          # release; its single-runtime release gate must remain intact.
          python3 scripts/qualify_postgres_runtime_handoff.py \
            --source workspace --stage-asupersync-version 0.6.1 --timeout 60 \
            --evidence-dir "$RUNNER_TEMP/runtime-handoff-evidence"

      - name: Verify the previous published passing control
        if: matrix.graph == 'previous-registry'
        run: |
          python3 scripts/qualify_postgres_runtime_handoff.py \
            --source registry --sqlmodel-version 0.4.3 --asupersync-version 0.4.10 \
            --case current-thread-normal --case current-thread-panic \
            --case two-worker-normal --case two-worker-panic \
            --timeout 60 \
            --evidence-dir "$RUNNER_TEMP/runtime-handoff-evidence"

      - name: Verify the published unfixed negative control
        if: matrix.graph == 'published-unfixed'
        run: |
          # A generic failure is insufficient: require both original hangs and
          # both exact two-worker controls to pass in the same invocation.
          if python3 scripts/qualify_postgres_runtime_handoff.py \
            --source registry --sqlmodel-version 0.5.1 --asupersync-version 0.5.0 \
            --case current-thread-normal --case current-thread-panic \
            --case two-worker-normal --case two-worker-panic \
            --timeout 60 --evidence-dir "$RUNNER_TEMP/runtime-handoff-evidence"; then
            echo "The unfixed graph unexpectedly passed; inspect the negative control."
            exit 1
          fi
          python3 - "$RUNNER_TEMP/runtime-handoff-evidence/summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text())
          expected = {
              "current-thread-normal": "timed_out",
              "current-thread-panic": "timed_out",
              "two-worker-normal": "passed",
              "two-worker-panic": "passed",
          }
          assert summary["sqlmodel_source"] == "registry", summary
          assert summary["sqlmodel_version"] == "0.5.1", summary
          assert summary["asupersync_version"] == "0.5.0", summary
          assert summary["asupersync_source"] == "published registry", summary
          assert len(summary["cases"]) == len(expected), summary
          actual = {case["case"]: case["status"] for case in summary["cases"]}
          assert actual == expected, actual
          for case in ("current-thread-normal", "current-thread-panic"):
              log = Path(sys.argv[1]).with_name(f"{case}.log").read_text()
              assert "holder joined and runtime dropped:" in log, case
              assert "consumer: before acquire (default checkout ping)" in log, case
              assert "consumer: acquired; before query" not in log, case
          print("Observed the two original current-thread timeouts; both two-worker controls passed.")
          PY

      - name: Preserve qualification manifests, features, and case logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-handoff-${{ matrix.graph }}
          path: ${{ runner.temp }}/runtime-handoff-evidence/
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check sqlmodel-mysql feature matrix
        run: |
          cargo check -p sqlmodel-mysql --no-default-features
          cargo check -p sqlmodel-mysql --features tls
          cargo check -p sqlmodel-mysql --features rsa-auth
          cargo check -p sqlmodel-mysql --all-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Version lines agree (Cargo.toml vs README vs CHANGELOG)
        # The 0.4.2 release was half-published while README already advertised
        # it. This step keeps the three places that state a version in lockstep
        # so a mismatch is visible before anything is tagged. Bead bd-jeof.4.
        run: |
          set -euo pipefail
          ws=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="sqlmodel") | .version')
          echo "workspace version: $ws"
          fail=0
          while IFS= read -r line; do
            v=$(echo "$line" | sed -nE 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p')
            if [ -n "$v" ] && [ "$v" != "$ws" ]; then echo "README version mismatch: $line"; fail=1; fi
          done < <(grep -E '^(# )?sqlmodel[a-z-]* = (\{ version = )?"[0-9]+\.[0-9]+\.[0-9]+"' README.md || true)
          lockstep=$(grep -oE 'lockstep at the same version \(([0-9]+\.[0-9]+\.[0-9]+)\)' README.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$lockstep" ] && [ "$lockstep" != "$ws" ]; then echo "README lockstep sentence says $lockstep"; fail=1; fi
          top=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$top" ] && [ "$top" != "$ws" ]; then echo "CHANGELOG top entry is $top, workspace is $ws"; fail=1; fi
          exit $fail

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace --verbose

      # The default-features run above covers the compile-fail half of the
      # facade's `tests/ui` (external-type fields without their feature); this
      # runs the half that must compile with the features on.
      - name: Run UI pass cases with the external-type features on
        run: cargo test -p sqlmodel --features chrono,uuid,decimal --test ui

      - name: Run doc tests (README doctests need the nightly-try feature)
        run: cargo test --workspace --doc --features sqlmodel/nightly-try

  integration:
    # Postgres and MySQL end-to-end suites. Until this job existed the
    # integration tests were env-gated and silently skipped on every run
    # (bead bd-slot.1). The final step fails the job if a suite skipped.
    name: Integration (Postgres 16 · MySQL 8.4 · MariaDB 11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sqlmodel
          POSTGRES_PASSWORD: sqlmodel
          POSTGRES_DB: sqlmodel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqlmodel -d sqlmodel_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sqlmodel
          MYSQL_DATABASE: sqlmodel_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psqlmodel"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: sqlmodel
          MARIADB_DATABASE: sqlmodel_test
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SQLMODEL_TEST_POSTGRES_URL: postgres://sqlmodel:sqlmodel@127.0.0.1:5432/sqlmodel_test
      SQLMODEL_TEST_MYSQL_URL: mysql://root:sqlmodel@127.0.0.1:3306/sqlmodel_test
      SQLMODEL_TEST_MARIADB_URL: mysql://root:sqlmodel@127.0.0.1:3307/sqlmodel_test
      RUST_LOG: sqlmodel=debug
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: integration

      - name: Run driver integration suites against live services
        run: |
          set -o pipefail
          cargo test -p sqlmodel-postgres -p sqlmodel-mysql --tests -- --nocapture 2>&1 | tee integration.log

      - name: Run end-to-end crate against every available driver
        run: |
          set -o pipefail
          if cargo metadata --format-version 1 --no-deps | jq -e '.packages[] | select(.name=="sqlmodel-e2e")' >/dev/null; then
            cargo test -p sqlmodel-e2e -- --nocapture 2>&1 | tee -a integration.log
          else
            echo "sqlmodel-e2e crate not present yet (bd-slot.2)"
          fi

      - name: Fail if any suite skipped instead of running
        run: |
          if grep -q "skipping .* integration tests" integration.log; then
            echo "A suite skipped although services are available:"; grep "skipping" integration.log; exit 1
          fi

  tls-matrix:
    name: TLS & Auth Matrix (Postgres 16 · MySQL 8.4 · MariaDB 11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sqlmodel
          POSTGRES_PASSWORD: sqlmodel
          POSTGRES_DB: sqlmodel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqlmodel -d sqlmodel_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sqlmodel
          MYSQL_DATABASE: sqlmodel_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psqlmodel"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: sqlmodel
          MARIADB_DATABASE: sqlmodel_test
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: tls-matrix

      - name: Generate TLS certificates with OpenSSL
        run: |
          set -euo pipefail
          mkdir -p /tmp/tls-certs
          cd /tmp/tls-certs
          # Generate CA key and self-signed CA cert
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 365 -subj "/CN=SQLModel Test CA"
          # Generate server key and CSR with SAN for localhost and 127.0.0.1
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
          cat <<EOF > server.ext
          authorityKeyIdentifier=keyid,issuer
          basicConstraints=CA:FALSE
          keyUsage = digitalSignature, keyEncipherment
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = localhost
          IP.1 = 127.0.0.1
          EOF
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 365 -extfile server.ext
          chmod 600 server.key ca.key
          echo "Generated certificates in /tmp/tls-certs"

      - name: Configure PostgreSQL TLS
        run: |
          set -euo pipefail
          PG_CONTAINER=$(docker ps --filter "ancestor=postgres:16" --format "{{.ID}}" | head -n1)
          echo "PostgreSQL container ID: $PG_CONTAINER"
          docker cp /tmp/tls-certs/server.crt $PG_CONTAINER:/var/lib/postgresql/server.crt
          docker cp /tmp/tls-certs/server.key $PG_CONTAINER:/var/lib/postgresql/server.key
          docker exec $PG_CONTAINER chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
          docker exec $PG_CONTAINER chmod 600 /var/lib/postgresql/server.key
          docker exec $PG_CONTAINER psql -U sqlmodel -d sqlmodel_test -c "ALTER SYSTEM SET ssl = 'on';"
          docker exec $PG_CONTAINER psql -U sqlmodel -d sqlmodel_test -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt';"
          docker exec $PG_CONTAINER psql -U sqlmodel -d sqlmodel_test -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key';"
          docker exec $PG_CONTAINER psql -U sqlmodel -d sqlmodel_test -c "SELECT pg_reload_conf();"

      - name: Configure MySQL TLS and extract CA
        run: |
          set -euo pipefail
          MYSQL_CONTAINER=$(docker ps --filter "ancestor=mysql:8.4" --format "{{.ID}}" | head -n1)
          echo "MySQL container ID: $MYSQL_CONTAINER"
          docker cp $MYSQL_CONTAINER:/var/lib/mysql/ca.pem /tmp/tls-certs/mysql-ca.pem
          # Enable require_secure_transport to test SslMode::Disable rejection
          docker exec $MYSQL_CONTAINER mysql -uroot -psqlmodel -e "SET GLOBAL require_secure_transport = ON;"

      - name: Run TLS matrix suites (Postgres & MySQL SslMode, MariaDB native auth)
        env:
          SQLMODEL_TEST_POSTGRES_URL: postgres://sqlmodel:sqlmodel@127.0.0.1:5432/sqlmodel_test
          SQLMODEL_TEST_POSTGRES_CA: /tmp/tls-certs/ca.crt
          SQLMODEL_TEST_POSTGRES_REQUIRE_SSL: "0"
          SQLMODEL_TEST_MYSQL_URL: mysql://root:sqlmodel@127.0.0.1:3306/sqlmodel_test
          SQLMODEL_TEST_MYSQL_CA: /tmp/tls-certs/mysql-ca.pem
          SQLMODEL_TEST_MYSQL_REQUIRE_SECURE_TRANSPORT: "1"
          SQLMODEL_TEST_MARIADB_URL: mysql://root:sqlmodel@127.0.0.1:3307/sqlmodel_test
        run: |
          cargo test -p sqlmodel-postgres -p sqlmodel-mysql --features sqlmodel-postgres/tls,sqlmodel-mysql/tls --test postgres_tls --test mysql_tls -- --nocapture

      - name: Verify Postgres SslMode::Disable rejection with hostssl
        run: |
          set -euo pipefail
          PG_CONTAINER=$(docker ps --filter "ancestor=postgres:16" --format "{{.ID}}" | head -n1)
          docker exec $PG_CONTAINER sed -i 's/^host all all all/hostssl all all all/' /var/lib/postgresql/data/pg_hba.conf
          docker exec $PG_CONTAINER sed -i 's/^host.*trust/# &/' /var/lib/postgresql/data/pg_hba.conf
          docker exec $PG_CONTAINER psql -U sqlmodel -d sqlmodel_test -c "SELECT pg_reload_conf();"
          SQLMODEL_TEST_POSTGRES_URL="postgres://sqlmodel:sqlmodel@127.0.0.1:5432/sqlmodel_test" \
          SQLMODEL_TEST_POSTGRES_CA="/tmp/tls-certs/ca.crt" \
          SQLMODEL_TEST_POSTGRES_REQUIRE_SSL="1" \
          cargo test -p sqlmodel-postgres --features tls --test postgres_tls postgres_tls_disable_when_ssl_required -- --nocapture

      - name: Test caching_sha2_password without TLS (rsa-auth key exchange)
        run: |
          set -euo pipefail
          MYSQL_CONTAINER=$(docker ps --filter "ancestor=mysql:8.4" --format "{{.ID}}" | head -n1)
          docker exec $MYSQL_CONTAINER mysql -uroot -psqlmodel -e "SET GLOBAL require_secure_transport = OFF;"
          SQLMODEL_TEST_MYSQL_URL="mysql://root:sqlmodel@127.0.0.1:3306/sqlmodel_test" \
          SQLMODEL_TEST_MYSQL_REQUIRE_SECURE_TRANSPORT="0" \
          cargo test -p sqlmodel-mysql --features tls,rsa-auth --test mysql_tls mysql_auth_caching_sha2_no_tls_rsa -- --nocapture

  asan:
    name: AddressSanitizer (SQLite FFI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: asan

      - name: Run SQLite tests under ASan
        run: cargo test -p sqlmodel-sqlite --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0:detect_stack_use_after_return=1"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: cargo audit (ignores must be justified in .cargo/audit.toml)
        run: cargo audit --deny warnings

      - name: cargo deny (advisories, banned crates, licenses, sources)
        run: cargo deny check advisories bans licenses sources

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check and test on the declared floor
        # RUSTFLAGS="" overrides the nightly-only `-Z threads=4` in .cargo/config.toml.
        # sqlmodel-frankensqlite (and the e2e crate that depends on it) are
        # excluded: fsqlite-pager enables `feature(core_intrinsics)` on x86_64,
        # so that driver is nightly-only.
        env:
          RUSTFLAGS: ""
        run: |
          excl="--exclude sqlmodel-frankensqlite"
          if cargo metadata --format-version 1 --no-deps | jq -e '.packages[] | select(.name=="sqlmodel-e2e")' >/dev/null; then
            excl="$excl --exclude sqlmodel-e2e"
          fi
          cargo check --workspace $excl
          cargo test --workspace $excl

  build:
    name: Build (${{ matrix.target }})
    needs: [lint, test, security, integration, asan, tls-matrix]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --workspace --release --target ${{ matrix.target }}

  size-and-startup:
    name: Size and startup (bd-4ttf.2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release examples
        run: |
          cargo build --release -p sqlmodel-e2e --example minimal_app
          cargo build --release -p sqlmodel-e2e --example minimal_app_franken

      - name: Size and startup gate (C SQLite driver — hard gate, PLAN targets)
        run: scripts/size_and_startup.sh target/release/examples/minimal_app 20 5 10

      - name: Size and startup report (FrankenSQLite driver — informational, 16 MiB pure-Rust target)
        run: scripts/size_and_startup.sh target/release/examples/minimal_app_franken 20 16 10

      - name: Where the bytes go (cargo-bloat report)
        run: |
          cargo install cargo-bloat || true
          cargo bloat --release --crates -p sqlmodel-e2e --example minimal_app > bloat_report.txt || true
          tail -40 bloat_report.txt

      - name: Upload bloat report
        uses: actions/upload-artifact@v7
        with:
          name: bloat-report
          path: bloat_report.txt

      - name: Bench regression guard (2x thresholds, CPU benches only)
        timeout-minutes: 40
        run: |
          cargo bench -p sqlmodel-e2e --bench sql_emission --bench row_conversion -- --noplot
          scripts/bench_guard.sh crates/sqlmodel-e2e/benches/thresholds.toml target/criterion
