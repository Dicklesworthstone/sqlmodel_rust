[package]
name = "sqlmodel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SQL databases in Rust, designed to be intuitive and type-safe"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sqlmodel"
readme = "README.md"
keywords = ["sql", "orm", "database", "sqlmodel", "async"]
categories = ["database", "database-implementations", "asynchronous"]

[lints]
workspace = true

[features]
default = []
console = ["dep:sqlmodel-console"]
c-sqlite-tests = ["dep:sqlmodel-sqlite"]
# Model fields of external value types (see sqlmodel-core's features of the same name).
chrono = ["sqlmodel-core/chrono"]
uuid = ["sqlmodel-core/uuid"]
decimal = ["sqlmodel-core/decimal"]
# `?` on `Outcome` (nightly toolchain); the README examples rely on it.
nightly-try = ["sqlmodel-core/nightly-try"]

[dependencies]
sqlmodel-core.workspace = true
sqlmodel-macros.workspace = true
sqlmodel-query.workspace = true
sqlmodel-schema.workspace = true
sqlmodel-session.workspace = true
sqlmodel-pool.workspace = true
asupersync.workspace = true
serde.workspace = true
serde_json.workspace = true

# Optional console support for rich output
sqlmodel-console = { workspace = true, optional = true }
sqlmodel-sqlite = { workspace = true, optional = true }

[dev-dependencies]
asupersync = { workspace = true, features = ["test-internals"] }
# `tests/ui`: a model with a chrono/uuid/rust_decimal field must fail to
# compile without the matching feature, with a diagnostic naming it. The
# external crates are dev-dependencies so the UI cases can name the types
# whether or not the feature is on.
trybuild = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
tracing = { workspace = true }

