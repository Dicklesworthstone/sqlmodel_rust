[package]
name = "sqlmodel-frankensqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "FrankenSQLite (pure-Rust) driver for SQLModel Rust"
readme = "README.md"

[lints]
workspace = true

[dependencies]
sqlmodel-core.workspace = true
asupersync.workspace = true
serde.workspace = true
serde_json.workspace = true
# The fsqlite family releases in lockstep; keep all four requirements on the
# same version the workspace tests against (see UPGRADE_LOG.md).
fsqlite = { version = "0.3.14", default-features = false, features = ["native", "async-api"] }
fsqlite-core = { version = "0.3.14", default-features = false, features = ["native"] }
fsqlite-types = { version = "0.3.14", default-features = false, features = ["native"] }
fsqlite-error = { version = "0.3.14", default-features = false }

[dev-dependencies]
asupersync = { workspace = true, features = ["test-internals"] }
