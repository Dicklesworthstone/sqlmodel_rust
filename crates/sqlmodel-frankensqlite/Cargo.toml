[package]
name = "sqlmodel-frankensqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "FrankenSQLite (pure-Rust) driver for SQLModel Rust"
readme = "README.md"

[lints]
workspace = true

[dependencies]
sqlmodel-core.workspace = true
asupersync.workspace = true
serde.workspace = true
serde_json.workspace = true
# The engine's public context types use Asupersync 0.5, matching SQLModel.
# The runtime-independent error crate remains on its existing release line.
fsqlite = { version = "0.4.0", default-features = false, features = ["native", "async-api"] }
fsqlite-core = { version = "0.4.0", default-features = false, features = ["native"] }
fsqlite-types = { version = "0.4.0", default-features = false, features = ["native"] }
fsqlite-error = { version = "0.3.18", default-features = false }

[dev-dependencies]
asupersync = { workspace = true, features = ["test-internals"] }
