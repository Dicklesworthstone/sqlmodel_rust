[package]
name = "sqlmodel-mysql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "MySQL driver for SQLModel Rust"
homepage.workspace = true
documentation = "https://docs.rs/sqlmodel-mysql"
readme = "README.md"
keywords = ["mysql", "sql", "database", "driver", "sqlmodel"]
categories = ["database", "database-implementations"]

[lints]
workspace = true

[features]
default = []
console = ["dep:sqlmodel-console"]
# TLS support via rustls
tls = ["dep:rustls", "dep:webpki-roots", "dep:rustls-pemfile"]

[dependencies]
sqlmodel-core.workspace = true
asupersync.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pinned to 0.10 with sha2: rsa 0.9 (the current STABLE release) requires the
# digest 0.10 trait family. sha1/sha2 0.11 moved to digest 0.11, so bumping
# them here breaks `rsa`'s Digest/DynDigest bounds. Only rsa 0.10.0-rc.x
# supports digest 0.11, and a release candidate is not an upgrade target for
# a stable-currency sweep. Bump all three together once rsa 0.10 ships.
sha1 = "0.11"
sha2 = "0.11"
# Held at 0.8 for the same reason as sha1/sha2 above: rsa 0.9 is built against
# rand_core 0.6, and `pub_key.encrypt(&mut rng, ..)` requires an RNG from that
# same rand_core major. rand 0.10 uses rand_core 0.10, so it cannot satisfy
# rsa 0.9's bound at all. Bump with rsa 0.10.
rand = "0.10"
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }

# Optional console support
sqlmodel-console = { workspace = true, optional = true }

# Optional TLS support
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = { version = "1", optional = true }
rustls-pemfile = { version = "2.2", optional = true }

[dev-dependencies]
sqlmodel-schema.workspace = true
